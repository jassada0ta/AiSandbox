<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Heights Condo Management</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Absolute minimal CSS necessary for print receipts */
        @media print {
            body * { visibility: hidden; }
            #printableReceipt, #printableReceipt * { visibility: visible; }
            #printableReceipt { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-light">

<!-- Top Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-3">
        <button class="btn btn-outline-light d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
            <i class="bi bi-list fs-5"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
            <i class="bi bi-buildings-fill text-primary"></i>
            <span>Serene Heights</span>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill fs-7 d-none d-sm-inline" data-i18n="badge_juristic">Juristic Portal</span>
        </a>

        <div class="d-flex align-items-center gap-2 ms-auto">
            <!-- Language Switcher -->
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-sm btn-outline-light active" id="btnLangEn" onclick="switchLanguage('en')">EN</button>
                <button type="button" class="btn btn-sm btn-outline-light" id="btnLangTh" onclick="switchLanguage('th')">ไทย</button>
            </div>

            <!-- Quick Reset Data Button -->
            <button class="btn btn-sm btn-outline-secondary text-light ms-1" onclick="resetDemoData()" title="Reset Demo Data" data-i18n-title="btn_reset_data">
                <i class="bi bi-arrow-counterclockwise"></i>
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Desktop Sidebar -->
        <aside class="col-lg-2 d-none d-lg-block bg-white border-end min-vh-100 py-3 p-2">
            <div id="desktopNavLinks" class="nav nav-pills flex-column gap-1">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- Mobile Sidebar Offcanvas -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
            <div class="offcanvas-header bg-dark text-white">
                <h5 class="offcanvas-title d-flex align-items-center gap-2">
                    <i class="bi bi-buildings-fill text-primary"></i> Serene Heights
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body p-2">
                <div id="mobileNavLinks" class="nav nav-pills flex-column gap-1">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="col-12 col-lg-10 p-3 p-md-4">
            <!-- Live Toast Notification Container -->
            <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
                <div id="appToast" class="toast align-items-center text-bg-success border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body" id="toastMessage">Success</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            </div>

            <!-- Dynamic View Sections -->
            <div id="view-dashboard" class="view-section"></div>
            <div id="view-parcels" class="view-section d-none"></div>
            <div id="view-repairs" class="view-section d-none"></div>
            <div id="view-bookings" class="view-section d-none"></div>
            <div id="view-billing" class="view-section d-none"></div>
            <div id="view-visitors" class="view-section d-none"></div>
            <div id="view-units" class="view-section d-none"></div>
            <div id="view-announcements" class="view-section d-none"></div>
        </main>
    </div>
</div>

<!-- Universal Modal Mount -->
<div class="modal fade" id="actionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" id="actionModalContent">
            <!-- Rendered dynamically -->
        </div>
    </div>
</div>

<!-- Receipt Printable Modal -->
<div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" id="receiptModalContent">
            <!-- Rendered dynamically -->
        </div>
    </div>
</div>

    // State initialization
    let db = JSON.parse(localStorage.getItem('serene_condo_db')) || defaultData;

    function saveDB() {
        localStorage.setItem('serene_condo_db', JSON.stringify(db));
    }

    function resetDemoData() {
        if (confirm(currentLang === 'en' ? "Reset all demo data back to default?" : "ยืนยันการคืนค่าข้อมูลเริ่มต้นทั้งหมดหรือไม่?")) {
            db = JSON.parse(JSON.stringify(defaultData));
            saveDB();
            renderCurrentView();
            showToast(t('msg_data_reset'));
        }
    }

    // Toast Notification helper
    function showToast(msg) {
        const toastEl = document.getElementById('appToast');
        document.getElementById('toastMessage').innerText = msg;
        const toast = new bootstrap.Toast(toastEl, { delay: 3500 });
        toast.show();
    }

    // Modal Helper
    let actionModalInstance = null;
    function openActionModal(title, bodyHtml, footerHtml = '') {
        const modalEl = document.getElementById('actionModal');
        const content = document.getElementById('actionModalContent');
        content.innerHTML = `
        <div class="modal-header">
          <h5 class="modal-title fw-bold">${title}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
      `;
        if (!actionModalInstance) {
            actionModalInstance = new bootstrap.Modal(modalEl);
        }
        actionModalInstance.show();
    }

    function closeActionModal() {
        if (actionModalInstance) {
            actionModalInstance.hide();
        }
    }

    // --- Navigation Definition ---
    const navItems = [
        { id: 'dashboard', icon: 'bi-speedometer2', labelKey: 'nav_dashboard' },
        { id: 'parcels', icon: 'bi-box-seam-fill', labelKey: 'nav_parcels', countKey: 'parcels' },
        { id: 'repairs', icon: 'bi-tools', labelKey: 'nav_repairs', countKey: 'repairs' },
        { id: 'bookings', icon: 'bi-calendar-check-fill', labelKey: 'nav_bookings' },
        { id: 'billing', icon: 'bi-receipt-cutoff', labelKey: 'nav_billing', countKey: 'billing' },
        { id: 'visitors', icon: 'bi-person-badge-fill', labelKey: 'nav_visitors' },
        { id: 'units', icon: 'bi-door-open-fill', labelKey: 'nav_units' },
        { id: 'announcements', icon: 'bi-megaphone-fill', labelKey: 'nav_announcements' }
    ];

    function buildSidebar() {
        const pendingParcels = db.parcels.filter(p => p.status === 'pending').length;
        const openRepairs = db.repairs.filter(r => r.status !== 'resolved').length;
        const unpaidBills = db.billing.filter(b => b.status === 'unpaid').length;

        function renderNavHTML() {
            return navItems.map(item => {
                let badgeHTML = '';
                if (item.countKey === 'parcels' && pendingParcels > 0) {
                    badgeHTML = `<span class="badge bg-warning text-dark ms-auto rounded-pill">${pendingParcels}</span>`;
                } else if (item.countKey === 'repairs' && openRepairs > 0) {
                    badgeHTML = `<span class="badge bg-danger ms-auto rounded-pill">${openRepairs}</span>`;
                } else if (item.countKey === 'billing' && unpaidBills > 0) {
                    badgeHTML = `<span class="badge bg-info text-dark ms-auto rounded-pill">${unpaidBills}</span>`;
                }

                const isActive = currentView === item.id ? 'active' : 'text-dark';
                return `
            <a href="javascript:void(0)" onclick="navigateTo('${item.id}')" class="nav-link ${isActive} d-flex align-items-center gap-2 py-2">
              <i class="bi ${item.icon} fs-5"></i>
              <span>${t(item.labelKey)}</span>
              ${badgeHTML}
            </a>
          `;
            }).join('');
        }

        document.getElementById('desktopNavLinks').innerHTML = renderNavHTML();
        document.getElementById('mobileNavLinks').innerHTML = renderNavHTML();
    }

    function navigateTo(viewId) {
        currentView = viewId;
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('d-none'));
        const activeEl = document.getElementById(`view-${viewId}`);
        if (activeEl) activeEl.classList.remove('d-none');
        buildSidebar();

        // Close mobile offcanvas if open
        const offcanvasEl = document.getElementById('sidebarOffcanvas');
        const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
        if (bsOffcanvas) bsOffcanvas.hide();

        renderCurrentView();
    }

    function switchLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('condo_lang', lang);
        document.getElementById('btnLangEn').classList.toggle('active', lang === 'en');
        document.getElementById('btnLangTh').classList.toggle('active', lang === 'th');

        // Update static navbar badges/titles
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.innerText = t(key);
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            el.setAttribute('title', t(key));
        });

        buildSidebar();
        renderCurrentView();
    }

    // --- View Renderers ---
    function renderCurrentView() {
        switch (currentView) {
            case 'dashboard': renderDashboard(); break;
            case 'parcels': renderParcels(); break;
            case 'repairs': renderRepairs(); break;
            case 'bookings': renderBookings(); break;
            case 'billing': renderBilling(); break;
            case 'visitors': renderVisitors(); break;
            case 'units': renderUnits(); break;
            case 'announcements': renderAnnouncements(); break;
        }
    }

    // 1. DASHBOARD
    function renderDashboard() {
        const occupiedUnits = db.units.filter(u => u.status === 'occupied').length;

    function autoFillResident(selectEl) {
        const opt = selectEl.options[selectEl.selectedIndex];
        const resident = opt.getAttribute('data-resident');
        if (resident && resident !== "Vacant Unit") {
            document.getElementById('parcelRecipient').value = resident;
        }
    }

    function submitParcel() {
        const unit = document.getElementById('parcelUnit').value;
        const recipient = document.getElementById('parcelRecipient').value;
        const carrier = document.getElementById('parcelCarrier').value;
        const tracking = document.getElementById('parcelTracking').value;

        if (!unit || !recipient || !tracking) {
            alert("Please complete all required fields");
            return;
        }

        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10) + ' ' + now.toTimeString().slice(0, 5);

        db.parcels.unshift({
            id: "P-" + Date.now().toString().slice(-4),
            unit, recipient, carrier, tracking,
            date: dateStr,
            status: "pending"
        });

        saveDB();
        closeActionModal();
        buildSidebar();
        renderParcels();
        showToast(t('msg_parcel_added'));
    }

    function markParcelCollected(id) {
        const p = db.parcels.find(x => x.id === id);
        if (p) {
            const now = new Date();
            p.status = 'collected';
            p.collectedAt = now.toISOString().slice(0, 10) + ' ' + now.toTimeString().slice(0, 5);
            saveDB();
            buildSidebar();
            renderParcels();
            showToast(t('msg_parcel_collected'));
        }
    }

    function submitUnit(editingUnitNo) {
        const unit = document.getElementById('uNumber').value;
        const floor = parseInt(document.getElementById('uFloor').value);
        const resident = document.getElementById('uResident').value;
        const phone = document.getElementById('uPhone').value || '-';
        const status = document.getElementById('uStatus').value;
        const type = document.getElementById('uType').value;

        if (!unit || !resident) {
            alert("Please provide unit number and resident name");
            return;
        }

        if (editingUnitNo) {
            const u = db.units.find(x => x.unit === editingUnitNo);
            if (u) {
                u.floor = floor;
                u.resident = resident;
                u.phone = phone;
                u.status = status;
                u.type = type;
            }
        } else {
            if (db.units.some(x => x.unit === unit)) {
                alert("Unit already exists!");
                return;
            }
            db.units.push({ unit, floor, resident, phone, status, type });
        }

        saveDB();
        closeActionModal();
        renderUnits();
        showToast(t('msg_unit_saved'));
    }

            id: "A-" + Date.now().toString().slice(-3),
            title, content, author,
            date: new Date().toISOString().slice(0, 10)
        });

        saveDB();
        closeActionModal();
        renderAnnouncements();
        showToast(t('msg_announcement_added'));
    }

    // App Initialization
    document.addEventListener("DOMContentLoaded", () => {
        switchLanguage(currentLang);
        navigateTo('dashboard');
    });
</script>
</body>
</html>
